[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensometer"
version = "0.1.0"
description = "PC app for Mathew's ball-screw tensometer: serial protocol, logging, plotting."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
tensometer-cli = "tensometer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
