name: firmware

on:
  push:
    paths: ["firmware/**", ".claude/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".claude/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  guards:
    # The flash-blocking hook must keep working; its self-test runs on every push.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/hooks/test-block-flash.sh

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cppcheck==1.5.3   # cppcheck-wheel, ships Cppcheck 2.22
      - name: cppcheck (firmware sources, headers, libraries)
        run: >
          cppcheck --std=c++17 --language=c++
          --enable=warning,style,performance,portability
          --inline-suppr --error-exitcode=1 --check-level=exhaustive -q
          --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unmatchedSuppression
          --template='{file}:{line}: [{severity}/{id}] {message}'
          -I firmware/include -I firmware/lib/crc16/src -I firmware/lib/cobs/src -I firmware/lib/frame/src
          firmware/src firmware/lib firmware/include

  native-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native

  build:
    runs-on: ubuntu-24.04
    needs: [guards, static-analysis, native-tests]
    strategy:
      matrix:
        env: [teensy41, teensy41_sim]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee build.log
      - name: Memory budget
        run: python3 tools/check_size.py build.log
      - name: Report platform versions (as annotations, for pinning)
        run: |
          pio pkg list -e ${{ matrix.env }} | grep -iE "platform|framework|toolchain" | while read -r line; do
            echo "::notice title=${{ matrix.env }} packages::$line"
          done
