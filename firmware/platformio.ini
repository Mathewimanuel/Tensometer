; Tensometer firmware (Teensy 4.1). See CLAUDE.md and .claude/skills/tensometer-firmware/SKILL.md.

[platformio]
default_envs = teensy41

[common]
warn_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion

; ---------------------------------------------------------------------------
; Phase 1 firmware: stress-strain core only.
; TODO(verify): pin the platform version (e.g. platformio/teensy@x.y.z) after
; the first successful CI build; read the installed version with `pio pkg list`.
; ---------------------------------------------------------------------------
[env:teensy41]
platform = platformio/teensy
board = teensy41
framework = arduino
build_unflags = -std=gnu++14 -std=gnu++11
build_flags =
    -std=gnu++17
    ${common.warn_flags}
    -DFEATURE_CONTINUITY=0
    -DFEATURE_ROUTING=0
    -DFEATURE_SIM_CONTINUITY=0
; Warnings are errors in our own sources (not in the Teensy core, which we don't control).
build_src_flags = -Werror
monitor_speed = 115200
; Uploading is done by Mathew only (see CLAUDE.md). No upload_protocol override.
; No on-target tests yet: `pio test` on a Teensy env would upload test firmware to the
; board. Remove this only when the hardware-in-the-loop rig exists.
test_ignore = *

; Phase 1 plus the simulated continuity module (bench and seam testing only).
[env:teensy41_sim]
extends = env:teensy41
build_flags =
    -std=gnu++17
    ${common.warn_flags}
    -DFEATURE_CONTINUITY=0
    -DFEATURE_ROUTING=0
    -DFEATURE_SIM_CONTINUITY=1

; ---------------------------------------------------------------------------
; Native unit tests for the pure-logic libraries in lib/ (no Arduino code).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
    ${common.warn_flags}
    -Werror
