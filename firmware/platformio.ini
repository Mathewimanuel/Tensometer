; Tensometer firmware (Teensy 4.1). See CLAUDE.md and .claude/skills/tensometer-firmware/SKILL.md.

[platformio]
default_envs = teensy41

[common]
warn_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
; PlatformIO adds include/ to the include path for src/ automatically, but not for lib/
; compilation units (LDF does not chase it unless a lib depends on something there). Add
; it explicitly so libs can share protocol.h/module_api.h/etc. with core (e.g. lib/
; messages depends on protocol.h for the message-body structs it encodes/decodes).
; -iquote, not -I: our include/limits.h collides by name with the C/C++ standard
; <limits.h>. -iquote only affects "..."-style includes (what our own code uses), never
; <...>-style ones, so Unity's own <limits.h> (pulled in via unity_internals.h) still
; resolves to the real system header instead of ours.
inc_flags =
    -iquote include

; ---------------------------------------------------------------------------
; Phase 1 firmware: stress-strain core only.
; Platform pinned to the version first verified in CI (2026-10-14):
; teensy 6.0.0 = framework-arduinoteensy 1.162.0 (Teensyduino 1.62),
; toolchain-gccarmnoneeabi-teensy 1.150201.0. Bump deliberately, never implicitly.
; ---------------------------------------------------------------------------
[env:teensy41]
platform = platformio/teensy@6.0.0
board = teensy41
framework = arduino
build_unflags = -std=gnu++14 -std=gnu++11
build_flags =
    -std=gnu++17
    ${common.warn_flags}
    ${common.inc_flags}
    -DFEATURE_CONTINUITY=0
    -DFEATURE_ROUTING=0
    -DFEATURE_SIM_CONTINUITY=0
; Warnings are errors in our own sources (not in the Teensy core, which we don't control).
build_src_flags = -Werror
monitor_speed = 115200
; Uploading is done by Mathew only (see CLAUDE.md). No upload_protocol override.
; No on-target tests yet: `pio test` on a Teensy env would upload test firmware to the
; board. Remove this only when the hardware-in-the-loop rig exists.
test_ignore = *

; Phase 1 plus the simulated continuity module (bench and seam testing only).
[env:teensy41_sim]
extends = env:teensy41
build_flags =
    -std=gnu++17
    ${common.warn_flags}
    ${common.inc_flags}
    -DFEATURE_CONTINUITY=0
    -DFEATURE_ROUTING=0
    -DFEATURE_SIM_CONTINUITY=1

; ---------------------------------------------------------------------------
; Native unit tests for the pure-logic libraries in lib/ (no Arduino code).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
    ${common.warn_flags}
    ${common.inc_flags}
    -Werror
